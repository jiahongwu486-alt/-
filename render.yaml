services:
  - type: web
    name: historical-persona
    runtime: node
    plan: free
    startCommand: node server/waffo-payment.mjs
    envVars:
      - key: WAFFO_MERCHANT_ID
        value: MER_2lujdyWwFKLsLlBCOnJKfr
      - key: WAFFO_ENV
        value: test
      - key: WAFFO_STORE_SLUG
        value: mithaq-y9hk7eyd
      - key: WAFFO_STORE_ID
        value: STO_6PelRkh3ttYesqlDMaZsYp
      - key: WAFFO_PRODUCT_ID
        value: PROD_1f86YaT5vrjaP2h2ehWYwB
      - key: ALLOWED_ORIGIN
        value: "*"
      # Final public URL assigned by Render (bare name was taken, so the -3hwk suffix is required)
      - key: WAFFO_SUCCESS_URL
        value: https://historical-persona-3hwk.onrender.com/
      # Merchant private key stays in the Render dashboard (secret, never committed).
      # WAFFO_WEBHOOK_PUBLIC_KEY is Waffo's *public* test-mode key (matches the
      # "公钥 TEST" shown in the Waffo dashboard). It is NOT a secret, so it is
      # pinned here so webhook signature verification (order.completed) passes.
      - key: WAFFO_PRIVATE_KEY
        sync: false
      - key: WAFFO_WEBHOOK_PUBLIC_KEY
        value: |
          -----BEGIN PUBLIC KEY-----
          
          -----END PUBLIC KEY-----
