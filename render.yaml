services:
  - type: web
    name: historical-persona
    runtime: node
    plan: free
    startCommand: node server/waffo-payment.mjs
    envVars:
      - key: WAFFO_MERCHANT_ID
        value: MER_2lujdyWwFKLsLlBCOnJKfr
      - key: WAFFO_ENV
        value: test
      - key: WAFFO_STORE_ID
        value: STO_6PelRkh3ttYesqlDMaZsYp
      - key: WAFFO_PRODUCT_ID
        value: PROD_1f86YaT5vrjaP2h2ehWYwB
      - key: ALLOWED_ORIGIN
        value: "*"
      # Replace with your final public URL after the first deploy
      - key: WAFFO_SUCCESS_URL
        value: https://historical-persona.onrender.com/
      # Set these manually in the Render dashboard (secrets must not be committed)
      - key: WAFFO_PRIVATE_KEY
        sync: false
      - key: WAFFO_WEBHOOK_PUBLIC_KEY
        sync: false
